# Builds the documentation site of depcurfew from the main branch of its repository and deploys it to GitHub Pages as
# the organization site https://depcurfew.github.io/ (decisions D-139 and D-178 in the main repository). It runs once a
# day and by hand (Actions, Pages, Run workflow), never on a push or a pull request. The checkout has every tag, so
# npm run site -- --versions adds the earlier releases, and while main is not the release of its version every page
# says so in a banner. It needs Pages set to "GitHub Actions" in the settings of this repository.
#
# This file is kept in the main repository as site/org-repo/.github/workflows/pages.yml and copied here by hand.
name: Pages

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

env:
  # The main repository, owner/name: the site is built from its main branch and its release tags. Change it here (and
  # the repository field of its package.json) if the repository moves.
  SOURCE_REPOSITORY: DevXord/depcurfew

# One deployment at a time; a newer one waits instead of cancelling a deployment that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site from main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The main branch with every tag: the pages of the current version come from it, the earlier versions from their
      # tags, and the site says on every page when main is not the release of its version (decision D-178).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The npm of packageManager in package.json of main: an older Node.js 24.x comes with an npm that lacks settings
      # of its .npmrc (decision D-099 in the main repository).
      - name: Install the npm of packageManager
        run: |
          version="$(node -p 'require("./package.json").packageManager.replace(/^npm@/u, "").replace(/\+.*$/u, "")')"
          npm install -g "npm@$version"
      - run: npm ci --ignore-scripts
      - run: npm run site -- --versions
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails with a message when Pages is not enabled for this repository.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
