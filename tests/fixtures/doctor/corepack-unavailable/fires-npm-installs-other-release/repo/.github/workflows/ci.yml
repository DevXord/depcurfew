on: push
jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm install -g npm@latest
      - run: npm ci
  before-setup:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g npm@11.19.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm ci
