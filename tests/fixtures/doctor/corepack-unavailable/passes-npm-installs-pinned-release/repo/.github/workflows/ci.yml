on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm install -g npm@11.19.1
      - run: npm ci
  same-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm i -g npm@11.19.1 && npm ci
