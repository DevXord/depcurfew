on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          composer config policy.cooldown true
          composer config policy.cooldown.period "7 days"
          composer config secure-http true
          composer config policy.cooldown no
          composer config --unset policy.cooldown
          composer config sort-packages true
          echo "COMPOSER_POLICY=1" >> "$GITHUB_ENV"
          COMPOSER_POLICY=1 composer update
