version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 1
  - package-ecosystem: "github-actions"
    directory: "/ci"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      include:
        - "actions/*"
