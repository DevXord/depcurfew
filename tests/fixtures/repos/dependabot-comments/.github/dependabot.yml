version: 2
updates:
  # The app
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "react"
      # - dependency-name: "eslint"
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 1
      exclude:
        - "react"
        # - "vue"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
