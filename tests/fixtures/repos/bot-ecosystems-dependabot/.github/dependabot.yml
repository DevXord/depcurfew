version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Go tools
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: "maven"
    directory: "/java-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    cooldown:
      semver-minor-days: 1 # minor updates first
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/tools"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 2
      exclude:
        - "Microsoft.*"
