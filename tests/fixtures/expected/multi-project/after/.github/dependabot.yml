version: 2
updates:
  # The web app.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # managed by depcurfew
    cooldown:
      default-days: 2
      exclude:
        - "@acme/*"
  # The API.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    # managed by depcurfew
    cooldown:
      default-days: 2
      exclude:
        - acme-*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
