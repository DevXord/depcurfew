[project]
name = "demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "idna",
  "docopt==0.6.2",
  "sampleproject @ git+https://github.com/pypa/sampleproject",
  "six @ https://files.pythonhosted.org/packages/d9/5a/e7c31adbe875f2abbb91bd84cf2dc52d792b5a01506781dbcf25c91daf11/six-1.16.0-py2.py3-none-any.whl",
  "local-lib",
]

[tool.uv]
# Keep uv in step with CI.
required-version = "==0.13.6"

# >>> depcurfew managed block: edit depcurfew.json and run depcurfew apply instead
exclude-newer = "36 hours"
exclude-newer-package = { "internal-lib" = false }
no-build = true
no-binary-package = ["docopt"]
# <<< depcurfew managed block

[tool.uv.sources]
local-lib = { path = "libs/local-lib" }
