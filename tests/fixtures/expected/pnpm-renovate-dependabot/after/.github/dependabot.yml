version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      # managed by depcurfew
      default-days: 3
      # managed by depcurfew
      exclude:
        - "@acme/*"
        - left-pad
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
