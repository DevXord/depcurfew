[project]
name = "demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["idna"]

[tool.uv]
dev-dependencies = []

# >>> depcurfew managed block [tool.uv]: edit depcurfew.json and run depcurfew apply instead
exclude-newer = "3 days"
no-build = true
# <<< depcurfew managed block

[tool.pdm]
distribution = false

[tool.pdm.resolution]
prefer-binary = "idna"

# >>> depcurfew managed block [tool.pdm.resolution]: edit depcurfew.json and run depcurfew apply instead
exclude-newer = "3d"
only-binary = ":all:"
# <<< depcurfew managed block
