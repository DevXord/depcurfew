name: depcurfew doctor
description: Find package manager configuration that silently does not work, and drift from depcurfew.json; report it to code scanning.
author: depcurfew
branding:
  icon: shield
  color: blue

inputs:
  directory:
    description: Directory to check, relative to the workspace.
    default: '.'
  sarif-file:
    description: Where to write the SARIF report, relative to the workspace; a path outside it works too.
    default: depcurfew.sarif
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning. The job needs the security-events write permission.
    default: 'true'
  category:
    description: Code scanning category of the upload, to tell several depcurfew runs in one workflow apart.
    default: depcurfew
  fail-on:
    description: Which findings fail the step and the depcurfew doctor check. Empty (the default) follows doctor.failOn in depcurfew.json, which depcurfew init sets to warning, and fails on errors only without it; error or warning overrides the policy, and warning makes warnings fail them too, as depcurfew doctor --fail-on warning does. Notes never do. Any other value fails the step.
    default: ''
  fail-on-error:
    description: Deprecated, use fail-on. false keeps the step from failing on findings at all, whatever fail-on says, and makes the depcurfew doctor check neutral instead of failed.
    default: 'true'
  annotations:
    description: Show the findings as annotations on the files, each with how to fix it, or one notice when there are none, which lists every check and its result. GitHub shows a limited number per step; the log lists every finding. Turn off when code scanning already shows them.
    default: 'true'
  job-summary:
    description: Add a table of the findings, each with how to fix it, and what was checked (tools, files read, every check with its result) to the job summary.
    default: 'true'
  check-run:
    description: Add a check named "depcurfew doctor" to the commit, with the result, every check and the findings as annotations on the files (at most 100, errors first), shown next to the code scanning entry in the Checks tab of a pull request. A later run on the same commit, such as push and pull_request of one commit, updates it instead of adding a second one. The job needs the checks write permission; without it the step only says so in the log.
    default: 'true'
  github-token:
    description: Token for the depcurfew doctor check; the workflow token by default.
    default: ${{ github.token }}

outputs:
  errors:
    description: Number of findings with level error.
    value: ${{ steps.doctor.outputs.errors }}
  warnings:
    description: Number of findings with level warning.
    value: ${{ steps.doctor.outputs.warnings }}
  notes:
    description: Number of findings with level note.
    value: ${{ steps.doctor.outputs.notes }}
  sarif-file:
    description: Path of the SARIF report, relative to the workspace when it is inside it, otherwise absolute; empty when doctor could not run or the report could not be written.
    value: ${{ steps.doctor.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Check the Node.js version
      id: node
      shell: bash
      run: |
        major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        if [ "$major" -ge 22 ]; then echo "setup=false" >> "$GITHUB_OUTPUT"; else echo "setup=true" >> "$GITHUB_OUTPUT"; fi

    - name: Set up Node.js 22
      if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false

    - name: Run depcurfew doctor
      id: doctor
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_JOB_SUMMARY: ${{ inputs.job-summary }}
        INPUT_CHECK_RUN: ${{ inputs.check-run }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/action/depcurfew.mjs"

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && steps.doctor.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.doctor.outputs.sarif-file }}
        category: ${{ inputs.category }}

    # The doctor step decides from fail-on, doctor.failOn in depcurfew.json and fail-on-error and sets fail-reason; it
    # never fails itself, so the SARIF upload above still runs.
    - name: Fail on findings
      if: steps.doctor.outputs.failure != '' || steps.doctor.outputs.fail-reason != ''
      shell: bash
      env:
        FAILURE: ${{ steps.doctor.outputs.failure }}
        REASON: ${{ steps.doctor.outputs.fail-reason }}
      run: |
        if [ -n "$FAILURE" ]; then
          echo "::error title=depcurfew::$FAILURE"
        else
          echo "::error title=depcurfew::$REASON"
        fi
        exit 1
