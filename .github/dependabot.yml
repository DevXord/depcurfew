# Updates for depcurfew's own dependencies and the actions its workflows pin by commit SHA. The release-age delay
# (cooldown) comes from depcurfew.json: depcurfew apply writes and keeps it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # TypeScript 7 has no classic compiler API, which the .d.ts build of tsdown and the ESM test need (decision D-148).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # managed by depcurfew
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
