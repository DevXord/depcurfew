# Builds the documentation site (npm run site) from README.md, the knowledge base and schema.json, and deploys it
# to GitHub Pages (decision D-132). It runs only for a published release, on the commit of its tag, and by hand
# (pick a release tag under "Use workflow from"), so the site shows a released version; it never runs on a push or
# a pull request. It needs Pages set to "GitHub Actions" in the settings of the repository, and an environment
# github-pages that lets the release tags deploy.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deployment that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The npm of packageManager in package.json: an older 24.x comes with an npm that lacks settings of .npmrc
      # (depcurfew doctor checks this, decision D-099).
      - run: npm install -g npm@11.19.1
      # The project .npmrc sets ignore-scripts, so no dependency script runs.
      - run: npm ci
      - run: npm run site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails with a message when Pages is not enabled for the repository.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
