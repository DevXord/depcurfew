name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    defaults:
      run:
        # Git Bash on Windows, so every step runs the same commands.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # The project .npmrc sets ignore-scripts, so no dependency script runs.
      - run: npm ci
      - run: npm test
      # The checks below do not depend on the system; they run once per Node.js version, on Linux.
      - if: runner.os == 'Linux'
        run: npm run typecheck
      - if: runner.os == 'Linux'
        run: npm run check:pkg
      - name: The committed action bundle matches the sources
        if: runner.os == 'Linux'
        run: |
          npm run build:action
          git diff --exit-code -- action/
