# CodeQL code scanning (decision D-176): the TypeScript and JavaScript of the repository and its GitHub Actions
# workflows. The results are code scanning alerts in the Security tab. Nothing is built and no dependency is installed:
# both languages are read from the source (build-mode: none).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The fixtures are sample repositories with workflows and scripts written to be wrong, and
          # action/depcurfew.mjs is the bundle built from src/, which is analyzed itself.
          config: |
            paths-ignore:
              - tests/fixtures
              - action/depcurfew.mjs
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
