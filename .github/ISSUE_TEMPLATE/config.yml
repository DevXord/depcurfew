# The choice a person sees on "New issue": issues are for bugs, wrong results and features (the forms in this
# directory); questions and ideas go to Discussions; vulnerabilities go to a private report, as SECURITY.md describes.
blank_issues_enabled: false
contact_links:
  - name: Ask a question or share an idea
    url: https://github.com/DevXord/depcurfew/discussions
    about: How to set depcurfew up, what a finding means, whether a setup is supported, or an idea to talk over first. Please ask in Discussions, not in an issue.
  - name: Report a vulnerability
    url: https://github.com/DevXord/depcurfew/security/advisories/new
    about: Report security problems privately, as SECURITY.md describes, never in an issue or a discussion.
